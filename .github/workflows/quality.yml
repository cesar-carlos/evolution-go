name: Go Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      format_base:
        description: Verified upstream commit for release formatting checks
        type: string
        required: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, vet, tests and race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      GOFLAGS: -mod=readonly
      SENDER_TEST_POSTGRES_DSN: postgres://postgres:sender-test@localhost:5432/sender_test?sslmode=disable
      AUTH_STORE_TEST_POSTGRES_DSN: postgres://postgres:sender-test@localhost:5432/sender_test?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: sender-test
          POSTGRES_DB: sender_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sender_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install native build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libjpeg-dev libwebp-dev ffmpeg poppler-utils

      - name: Check formatting of changed Go files
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          RELEASE_BASE: ${{ inputs.format_base }}
        run: |
          if [[ -n "$RELEASE_BASE" ]]; then
            base="$RELEASE_BASE"
          elif [[ -n "$PR_BASE" ]]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          elif [[ -n "$PUSH_BASE" && ! "$PUSH_BASE" =~ ^0+$ ]]; then
            base="$PUSH_BASE"
          else
            echo 'A valid comparison base is required' >&2
            exit 1
          fi
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD

          changed_files=$(mktemp)
          trap 'rm -f "$changed_files"' EXIT
          git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- '*.go' > "$changed_files"
          failed=0
          while IFS= read -r -d '' file; do
            unformatted=$(gofmt -l "./$file")
            if [[ -n "$unformatted" ]]; then
              printf 'Run gofmt on: %s\n' "$file"
              failed=1
            fi
          done < "$changed_files"
          exit "$failed"

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build ./...

      - name: Test fork release guards
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -timeout 5m ./...

      - name: Test with race detector
        run: go test -race -timeout 5m ./...

      - name: Test the pinned interactive Whatsmeow patch
        run: |
          go test -timeout 5m go.mau.fi/whatsmeow
          go test -race -timeout 5m go.mau.fi/whatsmeow

  browser:
    name: Manager and Sender browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
